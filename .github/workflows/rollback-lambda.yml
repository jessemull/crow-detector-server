name: Rollback Lambda

on:
  workflow_dispatch:
    inputs:
      s3_zip_file:
        description: 'Zip file name in S3 (e.g., previous.zip)'
        required: true
        type: string
      environment:
        description: 'Choose environment (dev/prod)'
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  rollback-lambda:
    name: Rollback Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: lambda-${{ github.event.inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
      S3_ZIP_FILE: ${{ github.event.inputs.s3_zip_file }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Reject an empty zip name
        run: |
          if [ -z "${S3_ZIP_FILE}" ] || [[ "${S3_ZIP_FILE}" == *"/"* ]]; then
            echo "s3_zip_file must be a file name" >&2
            exit 1
          fi

      - name: Set Up AWS CLI
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Deploy S3 Bucket Template First
        run: |
          ENVIRONMENT=${ENVIRONMENT}
          S3_BUCKET_STACK_NAME="crow-detector-lambda-bucket-stack-${ENVIRONMENT}"
          S3_BUCKET_TEMPLATE="lambda/cloudformation/crow-detector-lambda-s3.yaml"

          # Check if S3 bucket stack exists
          if ! aws cloudformation describe-stacks --stack-name "$S3_BUCKET_STACK_NAME" --region us-west-2 >/dev/null 2>&1; then
            echo "Creating S3 bucket stack..."
            aws cloudformation create-stack \
              --stack-name "$S3_BUCKET_STACK_NAME" \
              --template-body file://$S3_BUCKET_TEMPLATE \
              --parameters ParameterKey=Environment,ParameterValue="$ENVIRONMENT" \
              --capabilities CAPABILITY_NAMED_IAM \
              --region us-west-2
            
            echo "Waiting for S3 bucket stack creation..."
            aws cloudformation wait stack-create-complete \
              --stack-name "$S3_BUCKET_STACK_NAME" \
              --region us-west-2
          else
            echo "S3 bucket stack already exists, updating if needed..."
            set +e
            update_output=$(aws cloudformation update-stack \
              --stack-name "$S3_BUCKET_STACK_NAME" \
              --template-body file://$S3_BUCKET_TEMPLATE \
              --parameters ParameterKey=Environment,ParameterValue="$ENVIRONMENT" \
              --capabilities CAPABILITY_NAMED_IAM \
              --region us-west-2 2>&1)
            update_status=$?
            set -e
            if [[ $update_status -ne 0 ]]; then
              if [[ "$update_output" == *"No updates are to be performed"* ]]; then
                echo "No updates needed for S3 bucket stack"
              else
                echo "$update_output" >&2
                exit "$update_status"
              fi
            fi
          fi

      - name: Check Change Set Update/Create
        id: change_set_type
        run: |
          STACK_NAME="crow-detector-s3-lambda-stack-${ENVIRONMENT}"
          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region us-west-2 >/dev/null 2>&1; then
            echo "Updating change set..."
            echo "change_set_type=UPDATE" >> $GITHUB_ENV
          else
            echo "Creating change set..."
            echo "change_set_type=CREATE" >> $GITHUB_ENV
          fi

      - name: Create CloudFormation Change Set for Rollback
        run: |
          STACK_NAME="crow-detector-s3-lambda-stack-${ENVIRONMENT}"
          TEMPLATE_FILE="lambda/cloudformation/crow-detector-s3-lambda.yaml"
          CHANGE_SET_NAME="rollback-crow-detector-s3-lambda-change-set-${ENVIRONMENT}"
          CHANGE_SET_TYPE=${{ env.change_set_type }}
          S3_BUCKET="crow-detector-lambda-${ENVIRONMENT}"
          aws cloudformation create-change-set \
            --stack-name $STACK_NAME \
            --template-body file://$TEMPLATE_FILE \
            --parameters \
              "ParameterKey=S3Key,ParameterValue=crow-detector-s3-lambda/${S3_ZIP_FILE}" \
              "ParameterKey=Environment,ParameterValue=${ENVIRONMENT}" \
            --change-set-name $CHANGE_SET_NAME \
            --change-set-type $CHANGE_SET_TYPE \
            --capabilities CAPABILITY_NAMED_IAM \
            --region us-west-2

      - name: Wait for Change Set Creation
        run: |
          STACK_NAME="crow-detector-s3-lambda-stack-${ENVIRONMENT}"
          CHANGE_SET_NAME="rollback-crow-detector-s3-lambda-change-set-${ENVIRONMENT}"
          aws cloudformation wait change-set-create-complete \
            --stack-name $STACK_NAME \
            --change-set-name $CHANGE_SET_NAME \
            --region us-west-2

      - name: Execute CloudFormation Change Set
        run: |
          STACK_NAME="crow-detector-s3-lambda-stack-${ENVIRONMENT}"
          CHANGE_SET_NAME="rollback-crow-detector-s3-lambda-change-set-${ENVIRONMENT}"
          aws cloudformation execute-change-set \
            --stack-name $STACK_NAME \
            --change-set-name $CHANGE_SET_NAME \
            --region us-west-2

      - name: Monitor CloudFormation Stack Status
        run: |
          STACK_NAME="crow-detector-s3-lambda-stack-${ENVIRONMENT}"
          MAX_RETRIES=30
          RETRY_COUNT=0
          DONE_STATUSES=("CREATE_COMPLETE" "UPDATE_COMPLETE")
          FAILED_STATUSES=("CREATE_FAILED" "UPDATE_FAILED" "ROLLBACK_FAILED" "ROLLBACK_COMPLETE" "UPDATE_ROLLBACK_COMPLETE" "UPDATE_ROLLBACK_FAILED")
          while true; do
            STATUS=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --region us-west-2 --query "Stacks[0].StackStatus" --output text)
            echo "Status: $STATUS"
            if [[ " ${DONE_STATUSES[@]} " =~ " ${STATUS} " ]]; then
              echo "Rollback completed successfully!"
              break
            elif [[ " ${FAILED_STATUSES[@]} " =~ " ${STATUS} " ]]; then
              echo "Rollback failed!"
              exit 1
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [[ $RETRY_COUNT -ge $MAX_RETRIES ]]; then
              echo "Max retries reached, exiting."
              exit 1
            fi
            echo "Checking status..."
            sleep 10
          done
