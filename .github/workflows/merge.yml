name: Deploy On Merge

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to ECS Fargate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Check Formatting
        run: npm run format:check

      - name: npm audit (high+)
        run: npm audit --audit-level=high

      - name: Run Unit Tests
        env:
          AWS_REGION: us-west-2
          NODE_ENV: test
          PI_FEEDER_PUBLIC_KEY: test-feeder-key
          PI_PORCH_PUBLIC_KEY: test-porch-key
          PI_USER_PUBLIC_KEY: test-public-key
          S3_BUCKET_NAME: crow-detector-images-test
        run: npm run test:cov

      - name: Run Python Tests
        run: npm run porch:test

      - name: Build Application
        run: npm run build

      - name: Set Up AWS CLI
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Log Into AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783

      - name: Build Docker Image
        run: |
          docker build -t crow-detector-server:$GITHUB_SHA .
          docker tag crow-detector-server:$GITHUB_SHA ${{ steps.login-ecr.outputs.registry }}/crow-detector-server-dev:$GITHUB_SHA

      - name: Push Docker Image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/crow-detector-server-dev:$GITHUB_SHA
          echo "CONTAINER_IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/crow-detector-server-dev:$GITHUB_SHA" >> $GITHUB_ENV

      - name: Deploy ECS Task Definition to Dev
        run: |
          aws cloudformation deploy \
            --stack-name crow-detector-task-stack-dev \
            --template-file cloudformation/crow-detector-ecs-task.yaml \
            --parameter-overrides ContainerImage=${{ env.CONTAINER_IMAGE_URI }} Environment=dev \
            --capabilities CAPABILITY_NAMED_IAM \
            --region us-west-2
