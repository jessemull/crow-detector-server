name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      container_image:
        description: 'Container image to rollback to (e.g., 123456789012.dkr.ecr.us-west-2.amazonaws.com/crow-detector:abc123)'
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ecs-${{ github.event.inputs.environment }}
      cancel-in-progress: false
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Rollback ECS service
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          CONTAINER_IMAGE: ${{ github.event.inputs.container_image }}
        run: |
          echo "Rolling back ${ENVIRONMENT} to ${CONTAINER_IMAGE}"
          aws cloudformation deploy \
            --template-file cloudformation/crow-detector-ecs-task.yaml \
            --stack-name "crow-detector-task-stack-${ENVIRONMENT}" \
            --parameter-overrides \
              "Environment=${ENVIRONMENT}" \
              "ContainerImage=${CONTAINER_IMAGE}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region us-west-2
          echo "Rollback initiated successfully!"
