name: Feature Request
description: Request a new feature for Crow Detector Server
labels: ['enhancement']
body:
  - type: textarea
    attributes:
      label: Description
      description: Describe the feature you'd like.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Use Case
      description: Why is this feature needed?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed Solution
      description: How would you implement this?
  - type: dropdown
    attributes:
      label: Area
      options:
        - Feed / feeder behavior
        - Detection / classification
        - Device auth
        - Lambda glue
        - Infrastructure
        - Developer experience / tooling
        - Documentation
        - Other
