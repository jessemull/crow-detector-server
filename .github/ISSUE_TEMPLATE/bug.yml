name: Bug Report
description: Report a bug in the Crow Detector Server
labels: ['bug']
body:
  - type: textarea
    attributes:
      label: Description
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: How to reproduce the issue.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Area
      options:
        - Feed API
        - Detection API
        - URLs / presigned S3
        - ECDSA auth
        - Lambda (S3→SQS→API)
        - Image processing / Rekognition / Claude
        - Infrastructure / CloudFormation
        - CI / Tooling
        - Other
    validations:
      required: true
  - type: input
    attributes:
      label: Node.js Version
      placeholder: '22.x (API) / 20.x (Lambda)'
  - type: textarea
    attributes:
      label: Logs / Stack Trace
      description: Paste relevant bunyan/CloudWatch logs (redact secrets).
