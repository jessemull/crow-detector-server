openapi: 3.0.3
info:
  title: Crow Detector Server API
  description: API for Critter Canteen porch clips, feeder dispense proofs, and feeder animal visits
  version: 1.0.0
  contact:
    name: Critter Canteen
servers:
  - url: https://api-dev.crittercanteen.com
    description: Development environment
  - url: https://api.crittercanteen.com
    description: Production environment

paths:
  /health:
    get:
      summary: Health check
      description: Liveness check. Does not ping the database. ECS and Docker probe this path. Use GET /health/database for the database ping.
      tags:
        - Health
      responses:
        '200':
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - timestamp
                properties:
                  status:
                    type: string
                    example: 'ok'
                  timestamp:
                    type: string
                    format: date-time
  /health/database:
    get:
      summary: Database health check
      description: Pings PostgreSQL. This is not the task liveness probe.
      tags:
        - Health
      responses:
        '200':
          description: Database is reachable
        '503':
          description: Database is unreachable

  /urls/porch:
    post:
      summary: Create signed URL for porch clip upload
      description: Generate a pre-signed URL for uploading a porch-camera mp4 under porch/
      tags:
        - URLs
      security:
        - ECDSA: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePorchClipUrlDTO'
      responses:
        '201':
          description: Signed URL created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  signedUrl:
                    type: string
                    format: uri
                  key:
                    type: string
                  bucket:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                  metadata:
                    type: object
                    properties:
                      timestamp:
                        type: integer
                      type:
                        type: string
                        enum: [porch]
        '400':
          description: Bad request - invalid input data
        '401':
          description: Unauthorized - invalid authentication
        '403':
          description: The authenticated device is not the porch camera
        '500':
          description: Internal server error

  /porch/clips:
    get:
      summary: List porch clips
      description: Public list of recent porch clips with short-lived playback URLs
      tags:
        - Porch
      responses:
        '200':
          description: Clip list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PorchClip'
        '429':
          description: Too many requests
        '500':
          description: Internal server error

  /feeder/status:
    get:
      summary: Public feeder cooldown status
      description: |
        Whether the public Feed button can fire, when the cooldown ends, and the
        most recent ready feed timestamp. Rate-limited.
      tags:
        - Feeder
      responses:
        '200':
          description: Feeder status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeederStatus'
        '429':
          description: Too many requests

  /feeder/dispense:
    post:
      summary: Request a feeder dispense proof
      description: |
        Public unauthenticated write (rate-limited). Creates a dispense row when
        the 10-minute cooldown is clear. The feeder host later claims the row and
        uploads a separate proof clip. Apply scripts/db-seed/feeder-video.sql
        before serving this route. Keep under human review before widening prod
        exposure (docs/GOVERNANCE.md / docs/DEVICES.md).
      tags:
        - Feeder
      responses:
        '201':
          description: Dispense requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispenseCreateResponse'
        '409':
          description: Cooldown is active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeederCooldownConflict'
        '429':
          description: Too many requests
        '503':
          description: Cooldown check failed closed

  /feeder/dispense/{id}:
    get:
      summary: Read a dispense request
      description: Public status. Includes a short-lived proof URL once the clip is ready.
      tags:
        - Feeder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dispense status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispenseRequest'
        '404':
          description: Dispense request not found
        '429':
          description: Too many requests
    patch:
      summary: Finish a dispense proof
      description: Feeder host only. The row must already be recording.
      tags:
        - Feeder
      security:
        - ECDSA: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteDispenseDTO'
      responses:
        '200':
          description: Dispense updated
        '400':
          description: The row is not recording, or the proof key is invalid
        '401':
          description: Unauthorized
        '403':
          description: Caller is not the feeder host
        '404':
          description: Dispense request not found

  /feeder/dispense/pending:
    get:
      summary: Claim the next dispense proof
      description: |
        Feeder host only. Claims the oldest requested row, or a recording row
        abandoned for more than five minutes. Returns `{ "request": null }` when
        nothing is waiting.
      tags:
        - Feeder
      security:
        - ECDSA: []
      responses:
        '200':
          description: Claim result
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/DispenseRequest'
        '401':
          description: Unauthorized
        '403':
          description: Caller is not the feeder host

  /feeder/feeds:
    get:
      summary: List feed sections with proof and visit clips
      description: |
        Public gallery (rate-limited). Each ready dispense is a section with a
        re-signed proof clip and visits in that feed's time window (or linked by
        dispenseRequestId). Visits before the oldest listed feed are returned as
        ungroupedVisits.
      tags:
        - Feeder
      responses:
        '200':
          description: Feed sections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeederFeedsResponse'
        '429':
          description: Too many requests

  /feeder/clips:
    get:
      summary: List feeder visit clips
      description: |
        Public list of stored feeder visits (rate-limited). When FEEDER_REQUIRE_ANIMAL
        is off on the host, motion visits may be published without Claude classify.
        Prefer GET /feeder/feeds for the Feeder Cam gallery.
      tags:
        - Feeder
      responses:
        '200':
          description: Visit list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeederClip'
        '429':
          description: Too many requests

  /feeder/classify:
    post:
      summary: Classify one feeder frame
      description: |
        Feeder host only. The app-wide Fastify JSON body limit is 4 MiB so this
        route can accept large base64 frames (ClassifyFrameDTO maxLength 2_800_000).
        Decoded frames over 2_000_000 bytes are rejected. There is no Sharp resize
        step; JPEG/PNG/WebP media types only.
      tags:
        - Feeder
      security:
        - ECDSA: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyFrameDTO'
      responses:
        '201':
          description: Analysis result
        '400':
          description: Validation failed (empty body, media type, or field limits)
        '401':
          description: Unauthorized
        '403':
          description: Caller is not the feeder host, or the frame is empty or too large

  /feeder/visits:
    post:
      summary: Store an animal visit
      description: Feeder host only. The video key must be a feeder mp4 of at most 1024 characters.
      tags:
        - Feeder
      security:
        - ECDSA: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeederVisitDTO'
      responses:
        '201':
          description: Visit stored
        '400':
          description: Invalid visit
        '401':
          description: Unauthorized
        '403':
          description: Caller is not the feeder host

  /urls/feeder:
    post:
      summary: Create signed URL for feeder clip upload
      description: |
        Feeder host only. The presigned PUT is bound to video/mp4 and the
        declared content length, up to 100 MiB.
      tags:
        - URLs
      security:
        - ECDSA: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeederClipUrlDTO'
      responses:
        '201':
          description: Signed URL created
          content:
            application/json:
              schema:
                type: object
                properties:
                  signedUrl:
                    type: string
                    format: uri
                  key:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        '400':
          description: Invalid file name, content type, or size
        '401':
          description: Unauthorized
        '403':
          description: Caller is not the feeder host

components:
  securitySchemes:
    ECDSA:
      type: apiKey
      name: x-signature
      in: header
      description: |
        ECDSA signature for request authentication.
        Required headers:
        - x-device-id: Device identifier (pi-user, pi-feeder, pi-porch)
        - x-signature: Base64-encoded ECDSA signature
        - x-timestamp: Request timestamp in milliseconds

  schemas:
    CreatePorchClipUrlDTO:
      type: object
      required:
        - fileName
        - contentLength
      properties:
        fileName:
          type: string
          maxLength: 120
          description: Clip file name without path
          example: 'clip-20261114-210000'
        contentLength:
          type: integer
          minimum: 1
          maximum: 104857600
          description: Exact PUT body size in bytes. Content type is video/mp4.

    CreateFeederClipUrlDTO:
      type: object
      required:
        - fileName
        - contentLength
      properties:
        fileName:
          type: string
          maxLength: 120
          description: Clip file name without a path or ".."
          example: 'proof-req'
        contentLength:
          type: integer
          minimum: 1
          maximum: 104857600
          description: Exact upload size in bytes. The presigned PUT is bound to this length.
        contentType:
          type: string
          enum: [video/mp4]
          description: Feeder clips are mp4 only

    DispenseRequest:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [requested, recording, ready, failed]
        proofKey:
          type: string
          maxLength: 1024
          description: S3 object key under feeder/ when status is ready (host/claim payloads)
        proofClipUrl:
          type: string
          format: uri
          description: Short-lived playback URL on public GET when status is ready
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DispenseCreateResponse:
      type: object
      required:
        - id
        - status
        - cooldownEndsAt
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [requested, recording, ready, failed]
        cooldownEndsAt:
          type: string
          format: date-time

    FeederStatus:
      type: object
      required:
        - canFeed
        - cooldownEndsAt
        - lastFeedAt
        - lastFeedId
      properties:
        canFeed:
          type: boolean
        cooldownEndsAt:
          type: string
          format: date-time
          nullable: true
        lastFeedAt:
          type: string
          format: date-time
          nullable: true
        lastFeedId:
          type: string
          format: uuid
          nullable: true

    FeederCooldownConflict:
      type: object
      required:
        - message
        - cooldownEndsAt
      properties:
        statusCode:
          type: integer
          example: 409
        error:
          type: string
          example: Conflict
        message:
          type: string
        cooldownEndsAt:
          type: string
          format: date-time

    FeederFeedProof:
      type: object
      required:
        - playbackUrl
        - expiresAt
      properties:
        playbackUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time

    FeederFeed:
      type: object
      required:
        - id
        - fedAt
        - proof
        - visits
      properties:
        id:
          type: string
          format: uuid
        fedAt:
          type: string
          format: date-time
        proof:
          allOf:
            - $ref: '#/components/schemas/FeederFeedProof'
          nullable: true
        visits:
          type: array
          items:
            $ref: '#/components/schemas/FeederClip'

    FeederFeedsResponse:
      type: object
      required:
        - feeds
        - ungroupedVisits
      properties:
        feeds:
          type: array
          items:
            $ref: '#/components/schemas/FeederFeed'
        ungroupedVisits:
          type: array
          items:
            $ref: '#/components/schemas/FeederClip'

    CompleteDispenseDTO:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ready, failed]
        proofKey:
          type: string
          maxLength: 1024
          pattern: '^feeder/(?!.*\\.\\.)[A-Za-z0-9._/-]+\\.mp4$'
          description: Required when status is ready. Must be a feeder mp4 key.

    ClassifyFrameDTO:
      type: object
      required:
        - imageBase64
        - mediaType
      properties:
        imageBase64:
          type: string
          maxLength: 2800000
        mediaType:
          type: string
          enum: [image/jpeg, image/png, image/webp]

    CreateFeederVisitDTO:
      type: object
      required:
        - videoKey
        - animalCount
      properties:
        videoKey:
          type: string
          maxLength: 1024
          pattern: '^feeder/(?!.*\\.\\.)[A-Za-z0-9._/-]+\\.mp4$'
        animalCount:
          type: integer
          minimum: 1
          maximum: 100
        crowCount:
          type: integer
          minimum: 0
          maximum: 100
        dispenseRequestId:
          type: string
          format: uuid
        detectedAnimals:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/DetectedAnimal'

    FeederClip:
      type: object
      required:
        - id
        - recordedAt
        - animalCount
        - crowCount
        - playbackUrl
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
        recordedAt:
          type: string
          format: date-time
        animalCount:
          type: integer
        crowCount:
          type: integer
        playbackUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time

    PorchClip:
      type: object
      required:
        - name
        - recordedAt
        - playbackUrl
        - expiresAt
      properties:
        name:
          type: string
          description: Clip file name under porch/
          example: '1731628800000-clip-20261114-210000.mp4'
        recordedAt:
          type: string
          format: date-time
        playbackUrl:
          type: string
          format: uri
          description: Short-lived signed playback URL
        expiresAt:
          type: string
          format: date-time

    DetectedAnimal:
      type: object
      properties:
        name:
          type: string
          description: Name of the detected animal species
          example: 'Crow'
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Confidence score of the detection (0-100)
          example: 99.1
        count:
          type: integer
          minimum: 1
          description: Number of individual instances detected
          example: 2
      required:
        - name
        - confidence
        - count
      description: Represents a detected animal with confidence score and instance count
